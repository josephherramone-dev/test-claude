services:
  n8n:
    build: .
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC # change to your timezone, e.g. Europe/Paris
      # Execute Command is disabled by default in recent n8n versions; the workflow needs it for FFmpeg.
      - NODES_EXCLUDE=[]
      # Folder the Read/Write Files node is allowed to use (renders + music live here).
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      # Keep large video binaries out of the database.
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
      - shorts:/home/node/.n8n-files/shorts
      - ./music:/home/node/.n8n-files/music
    depends_on:
      - audiogen

  # Free local text-to-audio (Stable Audio Open). n8n reaches it at http://audiogen:8000
  audiogen:
    build: ./audiogen
    # NVIDIA GPU: build with --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu124
    # and uncomment the deploy block below.
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}   # free token from huggingface.co (accept the model licence first)
      - AUDIO_MODEL=${AUDIO_MODEL:-stabilityai/stable-audio-open-small}
    volumes:
      - shorts:/home/node/.n8n-files/shorts
      - models:/models
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  n8n_data:
  shorts:
  models:
